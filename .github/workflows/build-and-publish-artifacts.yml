name: Build and Publish Artifacts

permissions:
  contents: read
  id-token: write
  attestations: write
 
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - name: alertmanager
            image: robertp22/alertmanager

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Read version from Dockerfile
        id: version
        run: |
          VERSION=$(awk -F= '/^ARG VERSION=/ {print $2;exit}' ./${{ matrix.service.name }}/Dockerfile)
          test -n "${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0        

      - name: Extract metadata (tags, labels) for Docker [${{ matrix.service.image }}]
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ matrix.service.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push Docker image  [${{ matrix.service.image }}]
        id: push
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./${{ matrix.service.name }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation  [${{ matrix.service.image }}]
        uses: actions/attest@v4.1.0
        with:
          subject-name: index.docker.io/${{ matrix.service.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

